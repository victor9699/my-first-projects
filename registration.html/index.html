<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="reg"> 
        <h3>REGISTRATION FORM</h3>
    </div>
    <form action="http// google.com" method="POST">
        <div class="form g" >
        <div>
            <label for="FIRSTNAME">FIRSTNAME </label>
            <input type="text"placeholder=Victor  required name="FIRSTNAME" id="">

        </div>
       
        <div>
            <label for="LASTNAME">LASTNAME</label>
            <input type="text"placeholder=Bob required  name="LASTNAME" id="">

        </div>

        <div>
             <label for="PHONE NUMBER">PHONE NUMBER</label>
             <input type="tel" placeholder="+234..." name="PHONE NUMBER" id="">

        </div>

        <div>
            <label for="EMAIL">EMAIL</label>
            <input type="email"placeholder=...@.com name="" id="">

        </div>

        <div>
            <label for="GENDER">GENDER</label>
            <select>
                <option value="MALE">MALE</option>
                <option value="FEMALE">FEMALE</option>

            </select>
        </div>

         <div>
            <label for="PASSWORD">PASSWORD</label>
            <input type="password" name="PASSWORD" id="">

         </div>

         <button type="submit" > LOGIN</button>
    </form>
    

    </div>
</body>
</html>
